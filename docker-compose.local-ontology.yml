version: '3.8'

services:
  # Memgraph graph database (for path queries and graph traversal)
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: memgraph
    ports:
      - "7687:7687"  # Bolt protocol
      - "7444:7444"  # Memgraph Lab (web UI)
      - "3000:3000"  # Monitoring
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_log:/var/log/memgraph
      - memgraph_etc:/etc/memgraph
    environment:
      - MEMGRAPH_LOG_LEVEL=WARNING
      - MEMGRAPH="--memory-limit=4096"  # 4GB memory limit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7687"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Memgraph Lab for graph visualization
  # Already included in memgraph-platform image above
  # Access at http://localhost:7444

volumes:
  memgraph_data:
    driver: local
  memgraph_log:
    driver: local
  memgraph_etc:
    driver: local

networks:
  default:
    name: local-ontology-network
