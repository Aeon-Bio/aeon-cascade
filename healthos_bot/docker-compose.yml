services:
  mongo:
    container_name: mongo
    image: mongo:latest
    restart: always
    ports:
      - 127.0.0.1:${MONGODB_PORT:-27017}:${MONGODB_PORT:-27017}
    volumes:
      - ${MONGODB_PATH:-./mongodb}:/data/db
    # TODO: add auth

  chatgpt_telegram_bot:
    container_name: chatgpt_telegram_bot
    entrypoint: []
    command: ["python3", "bot/bot.py"]
    restart: always
    build:
      context: ".."
      dockerfile: healthos_bot/Dockerfile
    depends_on:
      - mongo
    environment:
      # AWS Bedrock credentials (REQUIRED)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}

      # Optional API keys
      - IQAIR_API_KEY=${IQAIR_API_KEY:-}
      - WRITER_API_KEY=${WRITER_API_KEY:-}
      - WRITER_GRAPH_ID=${WRITER_GRAPH_ID:-}

      # INDRA settings (align with root docker-compose.yml)
      - INDRA_BASE_URL=${INDRA_BASE_URL:-https://network.indra.bio}
      - INDRA_TIMEOUT=${INDRA_TIMEOUT:-30}
      - INDRA_CACHE_TTL=${INDRA_CACHE_TTL:-3600}

      # Agent settings
      - AGENT_MODEL=${AGENT_MODEL:-us.anthropic.claude-sonnet-4-5-20250929-v1:0}
      - AGENT_TEMPERATURE=${AGENT_TEMPERATURE:-0}

      # Application settings
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

  mongo_express:
    container_name: mongo-express
    image: mongo-express:latest
    restart: always
    ports:
      - 127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:${MONGO_EXPRESS_PORT:-8081}
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=${MONGODB_PORT:-27017}
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=false
      - ME_CONFIG_MONGODB_AUTH_DATABASE=chatgpt_telegram_bot
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USERNAME:-username}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-password}
    depends_on:
      - mongo
